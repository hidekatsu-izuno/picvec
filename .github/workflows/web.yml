name: Update web Wasm

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-web-wasm
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # Retain the workflow token for the generated-file commit below.
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust and bindings generator
        run: |
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal --target wasm32-unknown-unknown
          rustup override set "$rust_version"
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build and test
        run: |
          ./scripts/build-wasm.sh
          node scripts/test-wasm.mjs
      - name: Commit updated browser module
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- docs/pkg
          if git diff --cached --quiet; then
            echo "Browser module is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update browser WebAssembly module"
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # GITHUB_TOKEN commits do not trigger branch-based Pages builds.
          gh api --method POST "repos/$GH_REPO/pages/builds"
