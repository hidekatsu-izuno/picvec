name: Release binaries

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases, including runs started from different branches.
concurrency:
  group: release-binaries
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      rust: ${{ steps.metadata.outputs.rust }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Determine release tag from Cargo.toml
        id: release_tag
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
          PY
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ steps.release_tag.outputs.tag }}
          persist-credentials: false
      - name: Read release metadata from tag
        id: metadata
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          version = package["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match Cargo.toml version v{version}.")
          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{commit}"], text=True
          ).strip()
          rust = package["rust-version"]
          if rust.count(".") == 1:
              rust += ".0"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag={tag}\nrust={rust}\ncommit={commit}\n")
          PY
      - name: Require an unused release version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          # Listing also checks API access; authentication/network errors must fail.
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > releases.txt
          if grep -Fxq "$TAG" releases.txt; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: ${{ needs.prepare.outputs.rust }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install Rust from Cargo.toml
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
      - name: Build
        run: cargo +"$RUST_VERSION" build --release --locked --target "$TARGET" --bin picvec
      - name: Smoke test and package
        run: |
          binary=picvec
          if [[ "$TARGET" == *-windows-* ]]; then
            binary=picvec.exe
          fi
          executable="target/$TARGET/release/$binary"
          "$executable" --version
          "$executable" --help
          package="picvec-v$VERSION-$TARGET"
          mkdir -p "staging/$package" dist
          cp "$executable" README.md LICENSE "staging/$package/"
          if [[ "$TARGET" == *-windows-* ]]; then
            (cd staging && 7z a -tzip "../dist/$package.zip" "$package")
          else
            tar -czf "dist/$package.tar.gz" -C staging "$package"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-wasm:
    needs: prepare
    name: Build wasm32-unknown-unknown
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_VERSION: ${{ needs.prepare.outputs.rust }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust and bindings generator
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup override set "$RUST_VERSION"
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build, smoke test and package
        run: |
          ./scripts/build-wasm.sh
          node scripts/test-wasm.mjs
          package="picvec-v$VERSION-wasm32-unknown-unknown"
          mkdir -p "staging/$package" dist
          cp -R docs/. "staging/$package/"
          cp LICENSE "staging/$package/"
          tar -czf "dist/$package.tar.gz" -C staging "$package"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-wasm32-unknown-unknown
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [prepare, build, build-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Check assets and generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          if [[ "${#archives[@]}" -ne 7 ]]; then
            echo "::error::Expected six native archives and one WebAssembly archive."
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          options=()
          version_without_build="${TAG%%+*}"
          if [[ "$version_without_build" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "picvec $TAG" \
            --generate-notes \
            "${options[@]}"
