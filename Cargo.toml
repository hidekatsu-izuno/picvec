[package]
name = "picvec"
version = "1.0.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Perceptual, structure-aware raster to editable SVG converter"
repository = "https://github.com/hidekatsu-izuno/picvec"
readme = "README.md"
keywords = ["svg", "vectorization", "image", "graphics"]
categories = ["command-line-utilities", "graphics", "multimedia::images"]
include = [
    "/src/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md"
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
diagnostics = ["dep:serde_json"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12.0"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
wide = "1.7.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.23.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
web-time = "1.1"

[dev-dependencies]
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
