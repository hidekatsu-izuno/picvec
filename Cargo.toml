[package]
name = "picvec"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Perceptual, structure-aware raster to editable SVG converter"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.23.14", default-features = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

